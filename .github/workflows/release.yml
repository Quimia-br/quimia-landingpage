name: Criar release

# A cada merge na main, cria uma tag de versão e a release correspondente.
# A versão segue o SemVer e é calculada pelos Conventional Commits desde a última tag:
#   - mudança incompatível ("!" após o tipo ou "BREAKING CHANGE") -> major
#   - feat                                                       -> minor
#   - qualquer outra mudança                                     -> patch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório com o histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular a próxima versão
        id: version
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then
            echo "Este commit já tem uma versão, nada a fazer."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)

          if [ -z "$last" ]; then
            next="v1.0.0"
          else
            subjects=$(git log --no-merges --format=%s "$last..HEAD")
            bodies=$(git log --no-merges --format=%b "$last..HEAD")
            IFS=. read -r major minor patch <<< "${last#v}"

            if echo "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' || echo "$bodies" | grep -q '^BREAKING CHANGE'; then
              next="v$((major + 1)).0.0"
            elif echo "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "Próxima versão: $next (anterior: ${last:-nenhuma})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Criar a tag e a release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
